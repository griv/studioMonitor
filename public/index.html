<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Studio Monitor</title>
  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      background: #000;
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      cursor: none;
    }

    #stage {
      position: relative;
      width: 100%;
      height: 100%;
    }

    /* ── Base slide ── */
    .slide {
      position: absolute;
      inset: 0;
      opacity: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }
    .slide.active { opacity: 1; }

    /* ── contain / cover ── */
    .slide img.main, .slide video.main {
      width: 100%;
      height: 100%;
      display: block;
    }

    /* ── blur-bg: blurred cover layer + contained foreground ── */
    .slide .blur-layer {
      position: absolute;
      inset: -5%;  /* oversized to hide blur edges */
      width: 110%;
      height: 110%;
      object-fit: cover;
      filter: blur(28px) brightness(0.35) saturate(0.7);
      display: block;
    }
    .slide .fg-layer {
      position: relative;
      z-index: 1;
      width: 100%;
      height: 100%;
      object-fit: contain;
      display: block;
    }

    /* ── Ken Burns animations ── */
    @keyframes kb-zoom-in-r  { from { transform: scale(1.00) translate( 0%,  0%); } to { transform: scale(1.08) translate(-2%, -1%); } }
    @keyframes kb-zoom-in-l  { from { transform: scale(1.00) translate( 0%,  0%); } to { transform: scale(1.08) translate( 2%,  1%); } }
    @keyframes kb-zoom-out-r { from { transform: scale(1.08) translate(-2%, -1%); } to { transform: scale(1.00) translate( 0%,  0%); } }
    @keyframes kb-zoom-out-l { from { transform: scale(1.08) translate( 2%,  1%); } to { transform: scale(1.00) translate( 0%,  0%); } }
    @keyframes kb-drift-up   { from { transform: scale(1.06) translate( 0%,  2%); } to { transform: scale(1.06) translate( 0%, -2%); } }
    @keyframes kb-drift-dn   { from { transform: scale(1.06) translate( 0%, -2%); } to { transform: scale(1.06) translate( 0%,  2%); } }

    .kb-wrap {
      position: absolute;
      inset: 0;
      overflow: hidden;
    }
    .kb-wrap img, .kb-wrap video {
      width: 100%;
      height: 100%;
      object-fit: cover; /* cover fills frame, motion does the rest */
      transform-origin: center center;
    }

    /* ── caption ── */
    /* Sized for a 1080×1920 panel read from across a studio, not for a laptop.
       1080px across ~300mm is ~3.6px/mm, so legibility at 2–4m wants roughly 40px
       type. Discretion comes from opacity and colour, not from being small. */
    #caption {
      position: fixed;
      left: 0; right: 0; bottom: 0;
      min-height: 18vh;
      display: flex;
      align-items: flex-end;
      padding: 0 6vw 5vh;
      z-index: 10;
      pointer-events: none;
      font-family: system-ui, -apple-system, sans-serif;
      transition: opacity 1.2s ease;
    }
    #caption.hidden { opacity: 0; }

    /* White text over an arbitrary photograph is unreadable without a scrim. */
    #caption::before {
      content: '';
      position: absolute;
      inset: 0;
      z-index: -1;
      background: linear-gradient(to top, rgba(0,0,0,0.72), rgba(0,0,0,0));
    }

    #caption-inner { width: 100%; transition: opacity 0.2s ease; }

    .cap-primary {
      font-size: clamp(14px, 2.6vw, 34px);
      /* never #fff — lower duty cycle on the subpixels */
      color: rgba(255,255,255,0.82);
      line-height: 1.25;
    }
    .cap-secondary {
      font-size: clamp(11px, 1.7vw, 22px);
      color: rgba(255,255,255,0.5);
      line-height: 1.35;
      margin-top: 0.35em;
    }
    .cap-collection {
      font-size: clamp(9px, 1.05vw, 14px);
      letter-spacing: 0.22em;
      text-transform: uppercase;
      color: rgba(255,255,255,0.26);
      margin-top: 0.9em;
    }
    .cap-secondary:empty, .cap-collection:empty { display: none; }

    /* ── Burn-in drift ── */
    /* Nudges the whole frame a few pixels every several minutes. Free, invisible
       in motion, and it covers the caption too — which is the only genuinely
       static element when caption mode is `always`. */
    #stage, #caption {
      transform: translate(var(--drift-x, 0px), var(--drift-y, 0px));
      transition: transform 4s ease-in-out;
    }

    #empty {
      display: none;
      position: absolute;
      inset: 0;
      align-items: center;
      justify-content: center;
      color: rgba(255,255,255,0.12);
      font-family: system-ui, sans-serif;
      font-size: 11px;
      letter-spacing: 0.2em;
      text-transform: uppercase;
    }
    #empty.visible { display: flex; }
  </style>
</head>
<body>
  <div id="stage"></div>
  <div id="caption" class="hidden">
    <div id="caption-inner">
      <div class="cap-primary"></div>
      <div class="cap-secondary"></div>
      <div class="cap-collection"></div>
    </div>
  </div>
  <div id="empty">No media loaded</div>

  <script>
    const stage = document.getElementById('stage');
    const captionEl = document.getElementById('caption');
    const captionInner = document.getElementById('caption-inner');
    const emptyEl = document.getElementById('empty');

    const KB_ANIMS = ['kb-zoom-in-r','kb-zoom-in-l','kb-zoom-out-r','kb-zoom-out-l','kb-drift-up','kb-drift-dn'];
    let kbIndex = 0;

    let state = null;
    let currentIndex = 0;
    let timer = null;
    let activeSlide = null;
    let captionTimer = null;
    let collectionCaptionDue = false;
    // Listener group for the video currently driving the schedule. Aborted the
    // moment anything else takes over, because the outgoing clip keeps playing
    // through the crossfade and would otherwise carry on rescheduling `timer`
    // out from under the slide that replaced it.
    let videoWatch = null;
    let preloadEl = null;   // holds a reference so the fetch isn't collected

    // ── Caption ─────────────────────────────────────────────────────────────

    const collectionName = () =>
      (state?.currentVibe || state?.currentBank || '').replace(/[-_]/g, ' ');

    // What to say about a piece. Emphasis follows the bank: work that inspires me
    // credits the maker first; my own work leads with the title.
    function captionFor(item) {
      const collection = collectionName();
      if (!item) return collection ? { primary: collection } : null;

      const { artist, title, year, medium, bankKind } = item;
      if (!artist && !title) return collection ? { primary: collection } : null;

      if (bankKind === 'mine') {
        return {
          primary: title || artist,
          secondary: [year, medium].filter(Boolean).join(' · '),
          collection,
        };
      }

      if (artist) {
        return {
          primary: artist,
          secondary: [[title, year].filter(Boolean).join(', '), medium].filter(Boolean).join(' · '),
          collection,
        };
      }
      return { primary: title, secondary: [year, medium].filter(Boolean).join(' · '), collection };
    }

    function paintCaption(item) {
      const cap = captionFor(item);
      if (!cap) return false;
      captionInner.querySelector('.cap-primary').textContent = cap.primary || '';
      captionInner.querySelector('.cap-secondary').textContent = cap.secondary || '';
      // Don't repeat the collection when it's already the headline.
      captionInner.querySelector('.cap-collection').textContent =
        cap.collection && cap.collection !== cap.primary ? cap.collection : '';
      return true;
    }

    // hold === null keeps it up indefinitely.
    function showCaption(item, hold) {
      if (!paintCaption(item)) return;
      captionEl.classList.remove('hidden');
      clearTimeout(captionTimer);
      if (hold != null) captionTimer = setTimeout(() => captionEl.classList.add('hidden'), hold);
    }

    // Repaint without changing visibility — for when attribution was edited while
    // the same piece is on screen.
    function repaintIfVisible(item) {
      if (!captionEl.classList.contains('hidden')) paintCaption(item);
    }

    function captionOnSlide(item) {
      const mode = state.settings.captionMode || 'collection';
      const hold = state.settings.captionHoldMs ?? 6000;
      const due = collectionCaptionDue;
      collectionCaptionDue = false;   // consumed whatever the mode, so it can't fire later

      if (mode === 'always') {
        // Swap the text at the midpoint of a short fade rather than snapping.
        captionInner.style.opacity = '0';
        setTimeout(() => { paintCaption(item); captionInner.style.opacity = '1'; }, 200);
        captionEl.classList.remove('hidden');
        clearTimeout(captionTimer);
        return;
      }

      if (mode === 'item') {
        // Clamp, or the caption never clears between slides and `item` silently
        // degrades into `always`.
        showCaption(item, Math.max(1200, Math.min(hold, state.settings.dwellTime - 1500)));
        return;
      }

      // collection: only when the collection identity actually changed.
      if (due) showCaption(item, hold);
      else repaintIfVisible(item);
    }

    // Changing the mode has to take effect now, not at the next slide — otherwise
    // switching away from `always` leaves the caption stranded on the wall for a
    // whole dwell, which reads as the setting not working.
    function applyCaptionMode(item) {
      clearTimeout(captionTimer);
      captionInner.style.opacity = '1';
      if ((state.settings.captionMode || 'collection') === 'always') {
        paintCaption(item);
        captionEl.classList.remove('hidden');
      } else {
        // `item` captions the next piece; `collection` waits for a change or a reveal.
        captionEl.classList.add('hidden');
      }
    }

    // ── Burn-in drift ───────────────────────────────────────────────────────
    function driftTick() {
      const s = document.documentElement.style;
      s.setProperty('--drift-x', `${(Math.random() * 24 - 12).toFixed(1)}px`);
      s.setProperty('--drift-y', `${(Math.random() * 24 - 12).toFixed(1)}px`);
    }
    setInterval(driftTick, 7 * 60 * 1000);

    // ── Slide builders ──────────────────────────────────────────────────────

    function makeMediaEl(tag, src, fit) {
      const el = document.createElement(tag);
      el.src = src;
      if (tag === 'video') {
        el.autoplay = true;
        el.muted = true;
        el.playsInline = true;
        el.loop = false;
        // The incoming slide is already fading up by the time it is asked to
        // paint. Without this you crossfade into black for the first half-second.
        el.preload = 'auto';
      }
      el.style.objectFit = fit;
      return el;
    }

    function buildSlide(item, globalFit, fadeDuration) {
      const fit = item.fit || globalFit || 'contain';
      const slide = document.createElement('div');
      slide.className = 'slide';
      slide.style.transition = `opacity ${fadeDuration}ms ease-in-out`;
      slide.dataset.fit = fit;
      slide.dataset.type = item.type;   // read when this slide becomes the outgoing one

      const src = item.file;
      const tag = item.type === 'video' ? 'video' : 'img';

      if (fit === 'blur-bg' && item.type === 'image') {
        // Two-layer: blurred bg + contained fg
        const bg = document.createElement('img');
        bg.src = src;
        bg.className = 'blur-layer';
        bg.alt = '';
        const fg = document.createElement('img');
        fg.src = src;
        fg.className = 'fg-layer';
        fg.alt = '';
        fg.addEventListener('error', () => advance(), { once: true });
        slide.appendChild(bg);
        slide.appendChild(fg);

      } else if (fit === 'ken-burns') {
        const anim = KB_ANIMS[kbIndex++ % KB_ANIMS.length];
        const wrap = document.createElement('div');
        wrap.className = 'kb-wrap';
        const el = makeMediaEl(tag, src, 'cover');
        el.style.animation = `${anim} var(--kb-dur, 12s) ease-in-out forwards`;
        el.addEventListener('error', () => advance(), { once: true });
        if (tag === 'video') {
          // The global --kb-dur is derived from dwell time, which a video ignores.
          // An element-level override makes the move span the clip instead of
          // finishing early and then sitting still for the rest of it.
          el.addEventListener('loadedmetadata', () => {
            if (Number.isFinite(el.duration) && el.duration > 0) {
              el.style.setProperty('--kb-dur', `${el.duration}s`);
            }
          }, { once: true });
        }
        wrap.appendChild(el);
        slide.appendChild(wrap);

      } else {
        // contain or cover
        const el = makeMediaEl(tag, src, fit === 'cover' ? 'cover' : 'contain');
        el.className = 'main';
        el.addEventListener('error', () => advance(), { once: true });
        slide.appendChild(el);
      }

      return slide;
    }

    // ── Playback ────────────────────────────────────────────────────────────

    // Waiting for `ended` means the picture freezes on the last frame and only
    // then starts to fade — which reads as a stall, not a transition. Start the
    // fade `leadMs` early instead, so the outgoing clip is still moving as the
    // next piece comes up underneath it.
    //
    // Replanned on every timeupdate rather than set once from `duration`: a clip
    // that buffers, decodes slowly, or reports its duration late would otherwise
    // leave the schedule pointing at the wrong moment for the rest of the clip.
    function scheduleVideoAdvance(video, leadMs) {
      if (!video) { timer = setTimeout(advance, state.settings.dwellTime); return; }

      const watch = new AbortController();
      videoWatch = watch;
      const opts = { signal: watch.signal };
      const fire = () => { watch.abort(); advance(); };

      const plan = () => {
        const dur = video.duration;
        // Unknown so far — `ended` and the stall fallback still cover us.
        if (!Number.isFinite(dur) || dur <= 0) return;
        // A clip shorter than the crossfade would begin fading before it had
        // shown anything. Never give up more than half of one.
        const lead = Math.min(leadMs, (dur * 1000) / 2);
        const remaining = (dur - video.currentTime) * 1000 / (video.playbackRate || 1);
        clearTimeout(timer);
        timer = setTimeout(fire, Math.max(0, remaining - lead));
      };

      for (const ev of ['loadedmetadata', 'durationchange', 'timeupdate', 'play', 'ratechange', 'seeked']) {
        video.addEventListener(ev, plan, opts);
      }
      video.addEventListener('ended', fire, opts);

      // Autoplay can be refused and a decode can wedge before `timeupdate` ever
      // fires. Without this the wall stops on one frame until someone notices.
      timer = setTimeout(fire, 90_000);
      plan();   // duration may already be known from the preload
    }

    function showItem(index) {
      if (!state || !state.mediaList.length) {
        emptyEl.classList.add('visible');
        return;
      }
      emptyEl.classList.remove('visible');

      clearTimeout(timer);
      videoWatch?.abort();
      videoWatch = null;

      currentIndex = ((index % state.mediaList.length) + state.mediaList.length) % state.mediaList.length;
      const item = state.mediaList[currentIndex];
      const globalFit = state.settings.objectFit || 'contain';

      // A crossfade out of a video has to begin before the clip ends, so the fade
      // length and the head start are necessarily the same number — one setting.
      // Stills keep the general transition duration.
      const crossfade = state.settings.videoCrossfadeMs ?? 1500;
      const leavingVideo = activeSlide?.dataset.type === 'video' && crossfade > 0;
      const fadeDuration = leavingVideo ? crossfade : state.settings.transitionDuration;

      // Update Ken Burns duration from dwell time
      document.documentElement.style.setProperty('--kb-dur', `${(state.settings.dwellTime + fadeDuration) / 1000}s`);

      const newSlide = buildSlide(item, globalFit, fadeDuration);
      stage.appendChild(newSlide);

      // Preload what's next, so the fade lands on a decoded frame rather than black.
      const next = state.mediaList[(currentIndex + 1) % state.mediaList.length];
      if (next?.type === 'image') {
        const pre = new Image();
        pre.src = next.file;
      } else if (next?.type === 'video') {
        preloadEl = document.createElement('video');
        preloadEl.muted = true;
        preloadEl.preload = 'auto';
        preloadEl.src = next.file;
      }

      // Fade in
      requestAnimationFrame(() => requestAnimationFrame(() => {
        newSlide.classList.add('active');
        if (activeSlide) {
          const old = activeSlide;
          // The outgoing slide was built with whatever duration was current when
          // it appeared. Both halves of a crossfade have to agree, or the picture
          // dips through black in the middle or double-exposes at the ends.
          old.style.transitionDuration = `${fadeDuration}ms`;
          old.classList.remove('active');
          setTimeout(() => old.remove(), fadeDuration + 100);
        }
        activeSlide = newSlide;
      }));

      // Schedule next. Videos run to their own length whatever the fit — dwell
      // time has nothing to say about how long a clip is.
      if (item.type === 'video') {
        scheduleVideoAdvance(newSlide.querySelector('video'), crossfade);
      } else {
        timer = setTimeout(advance, state.settings.dwellTime);
      }

      captionOnSlide(item);
    }

    function advance() { showItem(currentIndex + 1); }

    // ── State management ────────────────────────────────────────────────────

    function applyState(newState) {
      const prevFiles = state ? state.mediaList.map(m => m.file).join() : '';
      const nextFiles = newState.mediaList.map(m => m.file).join();
      const listChanged = prevFiles !== nextFiles;

      const prevEpoch = state?.collectionEpoch;
      const prevMode = state?.settings?.captionMode;
      const onScreen = state?.mediaList[currentIndex]?.file;

      state = newState;
      // Epoch, not name: re-selecting the bank already playing is still a request
      // for something to happen.
      if (newState.collectionEpoch !== prevEpoch) collectionCaptionDue = true;

      if (!activeSlide) { clearTimeout(timer); currentIndex = 0; showItem(0); return; }

      if (state.settings.captionMode !== prevMode) {
        applyCaptionMode(state.mediaList[currentIndex]);
      }

      if (!listChanged) {
        // Same files, different payload — an attribution edit. Restarting here
        // would be wrong, but so is leaving a stale caption on the wall: you'd
        // type an artist name, see nothing change, and conclude it didn't work.
        if (collectionCaptionDue) captionOnSlide(state.mediaList[currentIndex]);
        else repaintIfVisible(state.mediaList[currentIndex]);
        return;
      }

      // The list changed. If what's on screen survived, keep showing it and carry
      // on from there rather than snapping back to the first image.
      const stillThere = state.mediaList.findIndex(m => m.file === onScreen);
      if (stillThere >= 0) {
        currentIndex = stillThere;
        if (collectionCaptionDue) captionOnSlide(state.mediaList[stillThere]);
        else repaintIfVisible(state.mediaList[stillThere]);
        return;
      }

      clearTimeout(timer);
      currentIndex = 0;
      showItem(0);
    }

    fetch('/api/status').then(r => r.json()).then(applyState).catch(console.error);

    function connectSSE() {
      const es = new EventSource('/api/events');
      es.addEventListener('state', e => { try { applyState(JSON.parse(e.data)); } catch {} });

      // "I like that — what is it?" With the caption hidden by default, this is
      // the answer that doesn't involve walking over to the machine.
      es.addEventListener('reveal', () => {
        const item = state?.mediaList[currentIndex];
        if (item) showCaption(item, state.settings.captionHoldMs ?? 6000);
      });

      es.onerror = () => { es.close(); setTimeout(connectSSE, 3000); };
    }
    connectSSE();
  </script>
</body>
</html>
